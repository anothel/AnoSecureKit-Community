# SPDX-License-Identifier: MPL-2.0
name: Native platform compatibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  binary-replacement:
    name: ${{ matrix.os }} frozen binary replacement
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install openssl:x64-windows
      - name: Frozen binary replacement (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)")
          fi
          python3 tests/abi/check_binary_replacement.py . "$RUNNER_TEMP/binary-replacement" -- -G Ninja "${args[@]}"
      - name: Frozen binary replacement (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          python tests/abi/check_binary_replacement.py . "$env:RUNNER_TEMP/binary-replacement" -- "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain immutable binary and evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: binary-replacement-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/binary-replacement/evidence.json
            ${{ runner.temp }}/binary-replacement/consumer/**/anosecurekit_consumer.exe
            ${{ runner.temp }}/binary-replacement/consumer/anosecurekit_consumer
